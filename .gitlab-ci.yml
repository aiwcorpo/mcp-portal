# No job needs a credential: the mcp-contracts artifacts come from Maven Central and npmjs. The runner sets CONTRACTS_TARBALL_URL
# and CONTRACTS_TARBALL_SHA256 for the web job when the package is served from the internal package server instead of npmjs.
stages:
  - verify

.on-merge-request-and-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

bff:
  extends: .on-merge-request-and-main
  stage: verify
  image: maven:3.9.12-eclipse-temurin-25
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key: maven
    paths: [.m2/repository]
  script:
    - cd bff
    - ./mvnw -B verify
  artifacts:
    when: always
    reports:
      junit: "bff/target/surefire-reports/TEST-*.xml"

web:
  extends: .on-merge-request-and-main
  stage: verify
  image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
  variables:
    CI: "1"
    PW_WORKERS: "4"
  script:
    - cd web
    - scripts/contracts.sh
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run i18n:check
    - npm test
    - npm run build
    - npm run e2e
