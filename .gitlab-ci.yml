# Thin wrapper: all logic is in bff/ci/run.sh and web/ci/run.sh, which also run in a developer's shell.
#
# Credentials for the registry with the mcp-contracts artifacts (MCP_MAVEN_REPOSITORY_URL, _USER, _PASSWORD) are CI/CD
# variables that must be masked, read-only and PROTECTED: they exist only on protected branches, never in a merge request
# pipeline, so code from a merge request cannot read them. Merge requests get the style checks; the build and the tests run
# on the default branch and need the artifacts there. The web job needs a runner with Docker (it builds its own image).
stages:
  - verify

bff-style:
  stage: verify
  image: maven:3.9.12-eclipse-temurin-25
  variables:
    CI_STEPS: style
  script:
    - bff/ci/run.sh

bff-build:
  stage: verify
  image: maven:3.9.12-eclipse-temurin-25
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  cache:
    key: maven
    paths: [.m2/repository]
  script:
    - bff/ci/run.sh
  artifacts:
    when: always
    reports:
      junit: "bff/target/surefire-reports/TEST-*.xml"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

web-style:
  stage: verify
  image: maven:3.9.12-eclipse-temurin-25
  variables:
    CI_STEPS: style
  script:
    - web/ci/run.sh

# The runner sets CONTRACTS_TARBALL_URL and CONTRACTS_TARBALL_SHA256 and provides the playwright v1.64.1-noble image (CI_BASE_IMAGE).
web:
  stage: verify
  tags: [docker]
  script:
    - web/ci/run.sh --container
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
