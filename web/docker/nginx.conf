# Static server of the portal SPA behind the reverse proxy that sends /api, /mcp and /s/ elsewhere. Behaves like the
# reference server (scripts/serve-csp.mjs): fallback to index.html, a fresh CSP nonce per response of index.html
# substituted for __CSP_NONCE__, index.html never cached. $request_id is 128 random bits.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 128; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;

    location = /__web/health { default_type text/plain; return 200 "ok\n"; }

    location = /index.html {
      sub_filter_once off;
      sub_filter '__CSP_NONCE__' $request_id;
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control "no-store" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    location / {
      try_files $uri /index.html;
    }

    location ~* "-[A-Za-z0-9_]{8}\.(js|css)$" {
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }
  }
}
