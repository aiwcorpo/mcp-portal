# Builds the images of a tagged release, pushes them to ghcr.io (organization aiwcorpo) and attaches the SBOMs (CycloneDX).
# Runs only on a v* tag; nothing is pushed from branches. Not run yet: the repository and the organization packages do not
# exist at the time of writing, so the workflow is checked by reading, not by a run.
#
# Three jobs, so that code that is built or tested never sees a write token: verify runs the tests and build builds the
# images and the SBOMs, both with contents: read only; push has packages: write and runs no project code at all: it takes the
# images that build saved as an artifact, loads them and pushes them. GITHUB_TOKEN with write access is read by the login
# step only (through env, not through the text of the script). Dependencies install with --ignore-scripts.
# The mcp-contracts artifacts are not read from GitHub Packages. They come from the public registries (npmjs, Maven Central)
# once mcp-contracts is released there; until then this workflow cannot fetch them and stops at the first download, so a
# release is cut with scripts/build-images.sh on a workstation. No credential is needed for the reads.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-java v4.7.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: bff/pom.xml
      - name: Base images are pinned by digest
        run: |
          # Every FROM and every ARG naming an image (*_IMAGE, BASE_IMAGE) in the Dockerfiles must end in @sha256:<64 hex>.
          bad=0
          for file in Dockerfile bff/ci/Dockerfile web/ci/Dockerfile; do
            while IFS= read -r line; do
              case "$line" in
                *@sha256:????????????????????????????????????????????????????????????????) ;;
                *) echo "no digest: $file: $line" >&2; bad=1 ;;
              esac
            done < <(grep -E '^(FROM [^ ]*|ARG [A-Z_]*IMAGE=.*)$' "$file" | grep -v '^FROM \${' | grep -v '^FROM [a-z]* AS ' )
          done
          exit "$bad"
      - name: Tag matches the versions of the BFF and the web part
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(cd bff && ./mvnw -q -B -N help:evaluate -Dexpression=project.version -DforceStdout)" = "$version"
          test "$(node -p "require('./web/package.json').version")" = "$version"
      - name: BFF (style, clean verify)
        run: bff/ci/run.sh
      - name: Web (style, lint, i18n, unit tests, build, Playwright)
        run: web/ci/run.sh --container

  build:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-java v4.7.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
      # actions/setup-node v4.4.0 (SHA read with git ls-remote): the web build needs Node 24, which the runner image
      # does not guarantee; scripts/build-images.sh also refuses an older one.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Images (bff, web, portal) from the tagged commit
        run: IMAGE_TAG="${GITHUB_REF_NAME}" IMAGE_REGISTRY=ghcr.io/aiwcorpo scripts/build-images.sh "${GITHUB_SHA}"
      - name: SBOM of the BFF and of the web part (CycloneDX)
        run: |
          mkdir -p sbom
          (cd bff && ./mvnw -B -ntp -s .ci/settings.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=bom)
          cp bff/target/bom.json sbom/mcp-portal-bff.cdx.json
          (cd web && scripts/contracts.sh && npm ci --ignore-scripts --no-audit --no-fund && npm sbom --sbom-format cyclonedx > ../sbom/mcp-portal-web.cdx.json)
      - name: Save the images for the push job
        run: |
          mkdir -p images
          docker save "ghcr.io/aiwcorpo/mcp-portal-bff:${GITHUB_REF_NAME}" "ghcr.io/aiwcorpo/mcp-portal-web:${GITHUB_REF_NAME}" \
            "ghcr.io/aiwcorpo/mcp-portal:${GITHUB_REF_NAME}" | gzip > images/mcp-portal-images.tar.gz
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom/
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: images
          path: images/
          retention-days: 1

  push:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: none
      packages: write
    steps:
      # actions/download-artifact v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: images
          path: images/
      - name: Load the images
        run: gunzip -c images/mcp-portal-images.tar.gz | docker load
      - name: Push to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          for name in mcp-portal-bff mcp-portal-web mcp-portal; do
            docker push "ghcr.io/aiwcorpo/${name}:${GITHUB_REF_NAME}"
          done
