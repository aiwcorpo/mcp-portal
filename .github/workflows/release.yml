# Builds the images of a tagged release, pushes them to ghcr.io (organization aiwcorpo) and attaches the SBOMs (CycloneDX).
# Runs only on a v* tag; nothing is pushed from branches. Not run yet: the repository and the organization packages do not
# exist at the time of writing, so the workflow is checked by reading, not by a run.
#
# Two jobs, so that code under test never sees a write token: verify runs the tests with contents: read and read-only
# credentials; publish has packages: write and the write token only in the environment of the push step.
# The mcp-contracts artifacts are read from the packages of aiwcorpo/mcp-contracts with the secret MCP_CONTRACTS_READ_TOKEN
# (a token with read:packages only, in the environment "release").
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      MCP_MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/aiwcorpo/mcp-contracts
      MCP_MAVEN_REPOSITORY_USER: ${{ vars.MCP_CONTRACTS_READ_USER }}
      MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MCP_CONTRACTS_READ_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.MCP_CONTRACTS_READ_TOKEN }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-java v4.7.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: bff/pom.xml
      - name: Tag matches the versions of the BFF and the web part
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(cd bff && ./mvnw -q -B -N help:evaluate -Dexpression=project.version -DforceStdout)" = "$version"
          test "$(node -p "require('./web/package.json').version")" = "$version"
      - name: BFF (style, clean verify)
        run: bff/ci/run.sh
      - name: Web (style, lint, i18n, unit tests, build, Playwright)
        run: web/ci/run.sh --container

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      MCP_MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/aiwcorpo/mcp-contracts
      MCP_MAVEN_REPOSITORY_USER: ${{ vars.MCP_CONTRACTS_READ_USER }}
      MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MCP_CONTRACTS_READ_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.MCP_CONTRACTS_READ_TOKEN }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # actions/setup-java v4.7.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '25'
      - name: Images (bff, web, portal) from the tagged commit
        run: IMAGE_TAG="${GITHUB_REF_NAME}" IMAGE_REGISTRY=ghcr.io/aiwcorpo scripts/build-images.sh "${GITHUB_SHA}"
      - name: SBOM of the BFF and of the web part (CycloneDX)
        run: |
          mkdir -p sbom
          (cd bff && ./mvnw -B -ntp -s .ci/settings.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=bom)
          cp bff/target/bom.json sbom/mcp-portal-bff.cdx.json
          (cd web && scripts/contracts.sh && npm ci --no-audit --no-fund && npm sbom --sbom-format cyclonedx > ../sbom/mcp-portal-web.cdx.json)
      - name: Push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for name in mcp-portal-bff mcp-portal-web mcp-portal; do
            docker push "ghcr.io/aiwcorpo/${name}:${GITHUB_REF_NAME}"
          done
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom/
