# Builds the images of a tagged release, pushes them to ghcr.io (organization aiwcorpo) and attaches the SBOMs (CycloneDX).
# Runs only on a version tag (vX.Y.Z); the images carry the tag without the v; nothing is pushed from branches. Not run yet: the repository and the organization packages do not
# exist at the time of writing, so the workflow is checked by reading, not by a run.
#
# Four jobs, so that code that is built or tested never sees a write token: verify runs the tests and build builds the
# images and the SBOMs, both with contents: read only; push has packages: write and runs no project code at all: it takes the
# images that build saved as an artifact, loads them and pushes them. GITHUB_TOKEN with write access is read by the login
# step only (through env, not through the text of the script). release has contents: write, no checkout and no build tool: it
# creates the draft GitHub Release with the SBOMs from the artifact. Dependencies install with --ignore-scripts.
# The mcp-contracts artifacts come from the public registries (Maven Central, npmjs), see env below; until 6.3.2 is released
# there the verify job stops at the first download. No credential is needed for the reads.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  # mcp-contracts 6.3.2 comes from the public registries: Maven Central (the default repository of Maven) and npmjs, the
  # tarball checked against the bytes of the release file. No credential is needed for the reads.
  CONTRACTS_FROM_NPMJS: '1'
  CONTRACTS_TARBALL_SHA256: 001c77faeedf66c3cf0dabf06be166d968c52c6025282b7be5c05c502fd22b2d

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - name: Base images are pinned by digest
        run: |
          # Every FROM and every ARG naming an image (*_IMAGE) in the Dockerfile must end in @sha256:<64 hex>.
          bad=0
          for file in Dockerfile; do
            while IFS= read -r line; do
              case "$line" in
                *@sha256:????????????????????????????????????????????????????????????????) ;;
                *) echo "no digest: $file: $line" >&2; bad=1 ;;
              esac
            done < <(grep -E '^(FROM [^ ]*|ARG [A-Z_]*IMAGE=.*)$' "$file" | grep -v '^FROM \${' | grep -v '^FROM [a-z]* AS ' )
          done
          exit "$bad"
      - name: Tag matches the versions of the BFF and the web part
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(cd bff && ./mvnw -q -B -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)" = "$version"
          test "$(node -p "require('./web/package.json').version")" = "$version"
      - name: BFF (verify)
        run: ./mvnw -B verify
        working-directory: bff
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Web (lint, i18n, unit tests, build, Playwright)
        working-directory: web
        env:
          CI: '1'
        run: |
          scripts/contracts.sh
          npm ci --no-audit --no-fund
          npm run lint
          npm run i18n:check
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run e2e

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      # The SHA was read with git ls-remote. The web build needs Node 24, which the runner image does not guarantee;
      # scripts/build-images.sh also refuses an older one.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Images (bff, web, portal) from the tagged commit
        run: IMAGE_TAG="${GITHUB_REF_NAME#v}" IMAGE_REGISTRY=ghcr.io/aiwcorpo scripts/build-images.sh "${GITHUB_SHA}"
      - name: SBOM of the BFF and of the web part (CycloneDX)
        run: |
          mkdir -p sbom
          (cd bff && ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DoutputFormat=json -DoutputName=bom)
          cp bff/target/bom.json sbom/mcp-portal-bff.cdx.json
          (cd web && scripts/contracts.sh && npm ci --ignore-scripts --no-audit --no-fund && npm sbom --sbom-format cyclonedx > ../sbom/mcp-portal-web.cdx.json)
      - name: Save the images for the push job
        run: |
          mkdir -p images
          tag="${GITHUB_REF_NAME#v}"
          docker save "ghcr.io/aiwcorpo/mcp-portal-bff:$tag" "ghcr.io/aiwcorpo/mcp-portal-web:$tag" \
            "ghcr.io/aiwcorpo/mcp-portal:$tag" | gzip > images/mcp-portal-images.tar.gz
      - name: Check the file lists of the artifacts
        run: |
          check() {
            local dir="$1" pattern="$2" unexpected
            unexpected="$(cd "$dir" && find . -mindepth 1 | sed 's|^\./||' | grep -Evx "$pattern" || true)"
            if [ -n "$unexpected" ]; then echo "unexpected files in $dir:" >&2; echo "$unexpected" >&2; exit 1; fi
          }
          check sbom 'mcp-portal-(bff|web)\.cdx\.json'
          check images 'mcp-portal-images\.tar\.gz'
          test -f sbom/mcp-portal-bff.cdx.json -a -f sbom/mcp-portal-web.cdx.json -a -f images/mcp-portal-images.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images
          path: images/
          retention-days: 1
          if-no-files-found: error

  push:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: none
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: images
          path: images/
      - name: Check the artifact file list
        run: |
          unexpected="$(cd images && find . -mindepth 1 | sed 's|^\./||' | grep -Evx 'mcp-portal-images\.tar\.gz' || true)"
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifact:" >&2; echo "$unexpected" >&2; exit 1; fi
          test -f images/mcp-portal-images.tar.gz
      - name: Load the images
        run: gunzip -c images/mcp-portal-images.tar.gz | docker load
      - name: Push to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          for name in mcp-portal-bff mcp-portal-web mcp-portal; do
            docker push "ghcr.io/aiwcorpo/${name}:${GITHUB_REF_NAME#v}"
          done

  release:
    needs: push
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: sbom/
      - name: Check the artifact file list
        run: |
          unexpected="$(cd sbom && find . -mindepth 1 | sed 's|^\./||' | grep -Evx 'mcp-portal-(bff|web)\.cdx\.json' || true)"
          if [ -n "$unexpected" ]; then echo "unexpected files in the artifact:" >&2; echo "$unexpected" >&2; exit 1; fi
          test -f sbom/mcp-portal-bff.cdx.json -a -f sbom/mcp-portal-web.cdx.json
      - name: Attach the SBOMs to the release
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" "${flags[@]}" sbom/*.cdx.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
