# Thin wrapper: all logic is in bff/ci/run.sh and web/ci/run.sh.
# No job has a token, a secret or write access: permissions are contents: read, the checkout keeps no credentials, and the
# mcp-contracts artifacts come from public registries (Maven Central for the BFF, npmjs for the web part), so the same jobs
# run for pull requests and for pushes to main. Until mcp-contracts 6.3.2 is on Central and npmjs the build jobs cannot
# resolve it; they are expected to fail on a fork or a checkout that is ahead of that release. Nothing here publishes.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bff-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: bff/ci/run.sh
        env:
          CI_STEPS: style
  web-style:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: web/ci/run.sh
        env:
          CI_STEPS: style
  bff-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # No cache, so a build never reuses what an earlier one left behind.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - run: bff/ci/run.sh
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # The tarball of @aiwcorpo/mcp-contracts 6.3.2 from npmjs, checked against the bytes of the release file.
      CONTRACTS_FROM_NPMJS: '1'
      CONTRACTS_TARBALL_SHA256: f99e6d182a7197aedb448c99a4b439087c23c8e85d6b9f6cefd9433c6c6a74c3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: web/ci/run.sh --container
