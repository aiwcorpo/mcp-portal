# Thin wrapper: all logic is in bff/ci/run.sh and web/ci/run.sh.
# The registry secrets MCP_MAVEN_REPOSITORY_URL, _USER and _PASSWORD (a read-only token) are secrets of the GitHub Environment
# `ci-main`, whose deployment branches are restricted to main in the repository settings. An `if` in this file does not protect
# them (a branch can edit it); the Environment rule does. Pull requests get only the style job, with no secrets.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bff-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bff/ci/run.sh
        env:
          CI_STEPS: style
  bff-build:
    if: github.event_name == 'push'
    environment: ci-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: bff/ci/run.sh
        env:
          MCP_MAVEN_REPOSITORY_URL: ${{ secrets.MCP_MAVEN_REPOSITORY_URL }}
          MCP_MAVEN_REPOSITORY_USER: ${{ secrets.MCP_MAVEN_REPOSITORY_USER }}
          MCP_MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MCP_MAVEN_REPOSITORY_PASSWORD }}
  web:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: web/ci/run.sh --container
