# Thin wrapper: all logic is in bff/ci/run.sh and web/ci/run.sh.
# Only the style checks run here, on pull requests and on pushes to main. They need neither a token nor a secret nor any
# package: permissions are contents: read and the checkout keeps no credentials. The build and the tests need the
# mcp-contracts artifacts, which are not published anywhere a runner can read without a credential yet; they run through
# bff/ci/run.sh and web/ci/run.sh on a workstation and in GitLab/Jenkins. When mcp-contracts is on npmjs and Maven Central,
# add the jobs here without any token, since both registries are public.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bff-style:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: bff/ci/run.sh
        env:
          CI_STEPS: style
  web-style:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: web/ci/run.sh
        env:
          CI_STEPS: style
