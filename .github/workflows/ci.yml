# No job has a token, a secret or write access: permissions are contents: read, the checkout keeps no credentials, and the
# mcp-contracts artifacts come from public registries (Maven Central for the BFF, npmjs for the web part), so the same jobs
# run for pull requests and for pushes to main. Until mcp-contracts 6.3.2 is on Central and npmjs the build jobs cannot
# resolve it; they are expected to fail on a fork or a checkout that is ahead of that release. Nothing here publishes.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  bff:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # No cache, so a build never reuses what an earlier one left behind.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - run: ./mvnw -B verify
        working-directory: bff
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: '1'
      # The tarball of @aiwcorpo/mcp-contracts 6.3.2 from npmjs, checked against the bytes of the release file.
      CONTRACTS_FROM_NPMJS: '1'
      CONTRACTS_TARBALL_SHA256: f99e6d182a7197aedb448c99a4b439087c23c8e85d6b9f6cefd9433c6c6a74c3
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: scripts/contracts.sh
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
